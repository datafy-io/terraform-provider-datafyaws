name: Datafy Release

on:
  workflow_dispatch:
    inputs:
      datafy_version:
        description: 'Datafy version (MAJOR.MINOR.PATCH, e.g. 1.4.0; MAJOR must be 1, MINOR and PATCH 0-99)'
        required: true
        type: string
      legacy_version:
        description: 'Use the deprecated legacy version format <AWS_MAJOR*1000 + AWS_MINOR>.<DATAFY_MINOR>.<DATAFY_PATCH> (e.g. 6042.4.0); the release docs get a deprecation notice'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  GOPRIVATE: github.com/datafy-io

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true

      # Default version format: <AWS_MAJOR>.<AWS_MINOR*100 + DATAFY_MINOR>.<AWS_PATCH*100 + DATAFY_PATCH>
      # e.g. AWS 5.100.1 + Datafy 1.5.1 -> v5.10005.101. The Datafy major (always 1) is not encoded.
      # Legacy version format (legacy_version=true): <AWS_MAJOR*1000 + AWS_MINOR>.<DATAFY_MINOR>.<DATAFY_PATCH>
      # e.g. AWS 6.42.x + Datafy 1.4.0 -> v6042.4.0. The AWS patch is not encoded.
      - name: Validate Datafy version
        env:
          DATAFY_VERSION: ${{ inputs.datafy_version }}
        run: |
          set -euo pipefail

          if ! echo "$DATAFY_VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$'; then
            echo "ERROR: datafy_version '$DATAFY_VERSION' must be MAJOR.MINOR.PATCH with MINOR and PATCH 0-99 and no leading zeros"
            exit 1
          fi

          # Neither version format encodes the Datafy major, so a different major cannot be released.
          DATAFY_MAJOR=$(echo "$DATAFY_VERSION" | cut -d. -f1)
          if [ "$DATAFY_MAJOR" != "1" ]; then
            echo "ERROR: datafy_version '$DATAFY_VERSION' must have major 1, got $DATAFY_MAJOR"
            exit 1
          fi

      - name: Calculate versions
        id: version
        env:
          DATAFY_VERSION: ${{ inputs.datafy_version }}
        run: |
          set -euo pipefail

          if [ ! -f .aws-version ]; then
            echo "ERROR: .aws-version not found at repo root"
            exit 1
          fi

          AWS_VERSION=$(sed 's/^v//' .aws-version | tr -d '[:space:]')
          if ! echo "$AWS_VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "ERROR: .aws-version '$AWS_VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          IFS=. read -r AWS_MAJOR AWS_MINOR AWS_PATCH <<< "$AWS_VERSION"

          IFS=. read -r _ DATAFY_MINOR DATAFY_PATCH <<< "$DATAFY_VERSION"

          VERSION="v${AWS_MAJOR}.$((AWS_MINOR * 100 + DATAFY_MINOR)).$((AWS_PATCH * 100 + DATAFY_PATCH))"
          LEGACY_LINE=$(printf "%d%03d" "$AWS_MAJOR" "$AWS_MINOR")
          LEGACY_VERSION="v${LEGACY_LINE}.${DATAFY_MINOR}.${DATAFY_PATCH}"

          echo "AWS ${AWS_VERSION} / Datafy ${DATAFY_VERSION}: version $VERSION, legacy version $LEGACY_VERSION"
          {
            echo "version=$VERSION"
            echo "legacy_version=$LEGACY_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Validate tag
        id: tag
        env:
          TAG: ${{ inputs.legacy_version && steps.version.outputs.legacy_version || steps.version.outputs.version }}
          LEGACY: ${{ inputs.legacy_version }}
        run: |
          set -euo pipefail

          if git tag --list | grep -qxF "$TAG"; then
            echo "ERROR: tag $TAG already exists"
            exit 1
          fi

          # Versions on a release line must strictly increase and the Datafy minor must never decrease.
          LINE=$(echo "$TAG" | cut -d. -f1)
          LATEST=$(git tag --list "${LINE}.*" | grep -E "^${LINE}\.[0-9]+\.[0-9]+$" | sort -V | tail -n1 || true)
          if [ -n "$LATEST" ]; then
            if [ "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -n1)" != "$TAG" ]; then
              echo "ERROR: $TAG is not greater than the latest release $LATEST on the ${LINE}.x line"
              exit 1
            fi
            DATAFY_MINOR=$(echo "$TAG" | cut -d. -f2)
            LATEST_DATAFY_MINOR=$(echo "$LATEST" | cut -d. -f2)
            if [ "$LEGACY" != "true" ]; then
              DATAFY_MINOR=$(( DATAFY_MINOR % 100 ))
              LATEST_DATAFY_MINOR=$(( LATEST_DATAFY_MINOR % 100 ))
            fi
            if [ "$DATAFY_MINOR" -lt "$LATEST_DATAFY_MINOR" ]; then
              echo "ERROR: Datafy minor $DATAFY_MINOR is lower than $LATEST_DATAFY_MINOR used by $LATEST"
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The registry renders each version's docs from its tagged commit, so a legacy release is
      # tagged on a branchless commit that adds a deprecation notice to the provider docs.
      - name: Add deprecation notice
        if: inputs.legacy_version
        env:
          LEGACY_VERSION: ${{ steps.version.outputs.legacy_version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if ! grep -qx '# DatafyAWS Provider' docs/index.md; then
            echo "ERROR: '# DatafyAWS Provider' heading not found in docs/index.md"
            exit 1
          fi

          NOTICE="~> **Deprecated:** We've changed our version format. This release, \`${LEGACY_VERSION#v}\`, is \`${VERSION#v}\` in the new format. Please update your version constraint to the new format; see [Versions](#versions) for how it works."
          awk -v notice="$NOTICE" '{ print } $0 == "# DatafyAWS Provider" { print ""; print notice }' docs/index.md > docs/index.md.tmp
          mv docs/index.md.tmp docs/index.md

          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deprecation notice for ${LEGACY_VERSION}" docs/index.md

      - name: Create tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/tags/${TAG}"
          echo "Created tag $TAG on $(git rev-parse HEAD)"

  goreleaser:
    needs: tag
    runs-on: arm64_core_builder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          # The multi-target build cache exceeds the 10GB Actions cache limit, so saving it only wastes time.
          cache: false

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v5
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.TERRAFORM_PROVIDER_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TERRAFORM_PROVIDER_GPG_PASSPHRASE }}

      - name: Read AWS version
        run: echo "AWS_VERSION=$(sed 's/^v//' .aws-version | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --timeout 3h --parallelism 8 --config .datafy-goreleaser.yml
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATAFY_VERSION: ${{ inputs.datafy_version }}
