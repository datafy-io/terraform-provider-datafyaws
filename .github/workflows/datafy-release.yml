name: Datafy Release

on:
  workflow_dispatch:
    inputs:
      datafy_version:
        description: 'Next Datafy version (MINOR.PATCH, e.g. 3.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  GOPRIVATE: github.com/datafy-io

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f .aws-version ]; then
            echo "ERROR: .aws-version not found at repo root"
            exit 1
          fi

          AWS_VERSION=$(cat .aws-version | sed 's/^v//')
          AWS_MAJOR=$(echo "$AWS_VERSION" | cut -d. -f1)
          AWS_MINOR=$(echo "$AWS_VERSION" | cut -d. -f2)
          NEW_MAJOR=$(printf "%d%03d" "$AWS_MAJOR" "$AWS_MINOR")

          VERSION="v${NEW_MAJOR}.${{ inputs.datafy_version }}"

          if ! echo "$VERSION" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "ERROR: '$VERSION' is not valid SemVer (no leading zeros allowed)"
            exit 1
          fi

          if git tag --list | grep -qxF "$VERSION"; then
            echo "ERROR: tag $VERSION already exists"
            exit 1
          fi
     
          gh api repos/${{ github.repository }}/git/refs --method POST -f ref="refs/tags/${VERSION}" -f sha="${{ github.sha }}"
          echo "Created tag: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: tag
    runs-on: datafy-16-cores
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v5
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.TERRAFORM_PROVIDER_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TERRAFORM_PROVIDER_GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --timeout 3h --parallelism 4 --config .datafy-goreleaser.yml
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
