name: Datafy Check Upstream

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
  push:

permissions:
  contents: read

concurrency:
  group: datafy-check-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: hashicorp/terraform-provider-aws
  UPSTREAM_URL: https://github.com/hashicorp/terraform-provider-aws.git

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - release/4.x
          - release/5.x
          - release/6.x
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Determine current upstream version
        id: current
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          if [ ! -f .aws-version ]; then
            echo "::error::.aws-version not found at repo root on ${BRANCH}"
            exit 1
          fi
          CURRENT=$(tr -d '[:space:]' < .aws-version)
          [[ "$CURRENT" == v* ]] || CURRENT="v$CURRENT"
          if ! [[ "$CURRENT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.aws-version content '$CURRENT' on ${BRANCH} is not vX.Y.Z"
            exit 1
          fi
          MAJOR=$(echo "$CURRENT" | sed -E 's/^v([0-9]+).*/\1/')
          EXPECTED_MAJOR=$(echo "$BRANCH" | sed -E 's|release/([0-9]+)\.x|\1|')
          if [ "$MAJOR" != "$EXPECTED_MAJOR" ]; then
            echo "::warning::${BRANCH} .aws-version major is ${MAJOR}, expected ${EXPECTED_MAJOR}"
          fi
          {
            echo "current=$CURRENT"
            echo "major=$MAJOR"
          } >> "$GITHUB_OUTPUT"
          echo "Branch ${BRANCH} — current upstream: $CURRENT (major $MAJOR)"

      - name: Get latest upstream v${{ steps.current.outputs.major }}.* tag
        id: tags
        run: |
          set -euo pipefail
          MAJOR="${{ steps.current.outputs.major }}"
          LATEST=$(git ls-remote --tags --refs "$UPSTREAM_URL" "v${MAJOR}.*" \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | grep -E "^v${MAJOR}\.[0-9]+\.[0-9]+$" \
            | sort -V \
            | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No upstream v${MAJOR}.* tags found"
            exit 1
          fi
          echo "Latest upstream v${MAJOR}.*: $LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        uses: madhead/semver-utils@v5
        with:
          version: ${{ steps.tags.outputs.latest }}
          compare-to: ${{ steps.current.outputs.current }}
          lenient: true

      - name: Echo (would notify n8n)
        if: steps.compare.outputs.comparison-result == '>'
        run: |
          echo "[${{ matrix.branch }}] behind upstream: current=${{ steps.current.outputs.current }} latest=${{ steps.tags.outputs.latest }}"
          echo "Would POST to N8N_WEBHOOK_URL — webhook step is disabled."

      # - name: Build webhook payload
