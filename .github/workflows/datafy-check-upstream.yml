      - name: Summary
        if: always()
        run: |
          {
            echo "## Datafy Upstream Check — \`${{ matrix.branch }}\`"
            echo ""
            echo "- Current (\`.aws-version\`): \`${{ steps.current.outputs.current }}\`"
            echo "- Latest upstream v${{ steps.current.outputs.major }}.*: \`${{ steps.tags.outputs.latest }}\`"
            echo "- Comparison (latest vs current): \`${{ steps.compare.outputs.comparison-result || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
