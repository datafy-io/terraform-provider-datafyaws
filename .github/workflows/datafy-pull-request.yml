name: Datafy Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        run: make go-build

  unit-tests:
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./internal/datafy ./internal/service/ec2 ./internal/provider

  importlint:
    name: Import lint
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: cd .ci/tools && go install github.com/pavius/impi/cmd/impi
      - run: impi --local . --scheme stdThirdPartyLocal ./...

  terraform_providers_schema:
    name: Terraform providers schema
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1
        with:
          terraform_version: 1.8.3
          terraform_wrapper: false
      - name: terraform init
        run: |
          # We need a file to initialize the provider
          echo 'data "aws_partition" "example" {}' > example.tf
          terraform init -plugin-dir terraform-plugin-dir
      - name: terraform providers schema
        run: |
          mkdir terraform-providers-schema
          terraform providers schema -json > terraform-providers-schema/schema.json

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: avto-dev/markdown-lint@v1
        with:
          args: '.'
          ignore: './docs ./website/docs ./CHANGELOG.md ./internal/service/cloudformation/testdata/examplecompany-exampleservice-exampleresource/docs'

  misspell:
    name: Misspell
    runs-on: datafy-16-cores
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ./.ci/tools/go.mod
      - run: cd .ci/tools && go install github.com/client9/misspell/cmd/misspell
      - run: make go-misspell

  build-and-push-docker:
    name: Build and Push Docker Image
    needs: [ build, unit-tests, terraform_providers_schema ]
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ECR_REPOSITORY: terraform-provider-datafyaws
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        run: make go-build

      - name: Copy binary for Docker build
        run: |
          os_arch=$(go env GOOS)_$(go env GOARCH)
          cp "terraform-plugin-dir/registry.terraform.io/hashicorp/aws/99.99.99/$os_arch/terraform-provider-aws" ./terraform-provider-datafyaws
          chmod +x ./terraform-provider-datafyaws

      - name: Build and push to ECR
        id: build-provider
        uses: ./.github/actions/build-provider
        with:
          aws-region: ${{ env.AWS_REGION }}
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          image-tag: ${{ github.event.pull_request.head.sha }}

      - name: Comment PR with image details
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const imageUri = '${{ steps.build-provider.outputs.image-uri }}';
            const commitHash = '${{ github.event.pull_request.head.sha }}';
            
            const comment = `## 🐳 Docker Image Built Successfully
            
            **Commit Hash:** \`${commitHash}\`
            **Image URI:** \`${imageUri}\`
            
            The Terraform provider has been built and pushed to ECR. You can use this image for testing by referencing the commit hash: \`${commitHash}\`
            
            ### Usage Example:
            \`\`\`bash
            # Pull the image
            docker pull ${imageUri}
            
            # Use in your Terraform configuration
            # (Setup instructions will depend on your specific testing workflow)
            \`\`\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

