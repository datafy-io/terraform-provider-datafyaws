name: 'Build Terraform Provider'
description: 'Builds and pushes Terraform provider Docker image to ECR'
inputs:
  aws-region:
    description: 'AWS region'
    required: true
    default: 'us-east-1'
  ecr-repository:
    description: 'ECR repository name'
    required: true
  image-tag:
    description: 'Docker image tag'
    required: true
outputs:
  image-uri:
    description: 'Built image URI'
    value: ${{ steps.build.outputs.image-uri }}
runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      id: build
      shell: bash
      run: |
        ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
        IMAGE_URI=$ECR_REGISTRY/${{ inputs.ecr-repository }}:${{ inputs.image-tag }}
        
        echo "Building Docker image: $IMAGE_URI"
        docker build -t $IMAGE_URI .
        
        echo "Pushing Docker image to ECR..."
        docker push $IMAGE_URI
        
        echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT
        echo "Successfully pushed image: $IMAGE_URI"
