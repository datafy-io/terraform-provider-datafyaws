name: 'Build Terraform Provider Docker Image'
description: 'Builds and pushes Terraform provider Docker image to ECR'
inputs:
  image-tag:
    description: 'Docker image tag'
    required: true
outputs:
  image-uri:
    description: 'Built image URI'
    value: ${{ steps.build.outputs.image-uri }}
runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}
        role-to-assume: ${{ secrets.MANAGEMENT_AWS_ROLE_ARN }}
    - name: Login to Amazon ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and push
      id: build
      shell: bash
      run: |
        IMAGE_URI=${{ steps.ecr.outputs.registry }}/datafy-io/terraform-provider-datafyaws:${{ inputs.image-tag }}
        
        echo "Building Docker image: $IMAGE_URI"
        docker build -t $IMAGE_URI .
        
        echo "Pushing Docker image to ECR..."
        docker push $IMAGE_URI
        
        echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT
        echo "Successfully pushed image: $IMAGE_URI"
